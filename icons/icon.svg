<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Recurring Progress Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-dasharray="850 1130" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  
  <!-- Nagging Alert Pulse Rings -->
  <circle cx="340" cy="170" r="48" fill="#ef4444" opacity="0.3" filter="url(#glow)"/>
  <circle cx="340" cy="170" r="28" fill="#f43f5e"/>
  <text x="340" y="179" font-family="-apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">!</text>

  <!-- Central Bell & Checkmark Symbol -->
  <g transform="translate(146, 150) scale(0.43)">
    <!-- Bell Shape -->
    <path d="M256 80c-55.2 0-100 44.8-100 100v120l-40 40v20h280v-20l-40-40V180c0-55.2-44.8-100-100-100z" fill="url(#ringGrad)" />
    <!-- Clapper -->
    <circle cx="256" cy="400" r="32" fill="#ec4899" />
    <!-- Checkmark inside bell -->
    <path d="M200 240l40 40 80-80" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
